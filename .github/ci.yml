name: Pact Tests and Publish

on:
  - push
  - workflow_dispatch

jobs:
  pact-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install

      - name: Run consumer tests
        run: npm run test:web:consumer

      - name: Run provider tests
        run: npm run test:provider

      - name: Publish Pact
        env:
          PACT_BROKER_URL: https://ecoonline-df4261df.pactflow.io
          PACT_API_TOKEN: ${{ secrets.PACT_API_TOKEN }}
          GIT_COMMIT_SHA: ${{ github.sha }}
        run: npm run publish:pact